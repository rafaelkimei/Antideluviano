<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Ofício SEI - Infra S.A.</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        document: ['Calibri', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar for preview panel */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* SEI Document Specific Formatting Styles */
        .sei-document {
            font-family: Calibri, sans-serif;
            font-size: 12pt;
            color: #000000;
            line-height: 1.25;
            background-color: #ffffff;
        }
        .sei-document p {
            margin-top: 6pt;
            margin-bottom: 6pt;
            word-wrap: normal;
        }
        .sei-header-units {
            font-size: 13pt;
            font-family: Calibri;
            text-align: center;
            text-transform: uppercase;
            margin: 0;
            font-weight: normal;
        }
        .sei-align-left-simple {
            font-size: 12pt;
            font-family: Calibri;
            text-align: left;
            margin: 0;
        }
        .sei-align-right {
            font-size: 12pt;
            font-family: Calibri;
            text-align: right;
            margin: 6pt;
        }
        .sei-justified-indent {
            font-size: 12pt;
            font-family: Calibri;
            text-indent: 25mm;
            text-align: justify;
            margin: 6pt 8px;
        }
        .sei-paragraph-num-n1 {
            font-size: 12pt;
            font-family: Calibri;
            text-align: justify;
            margin: 8px;
        }
        .sei-paragraph-num-n2 {
            font-size: 12pt;
            font-family: Calibri;
            text-align: justify;
            margin: 8px 8px 8px 25mm;
        }
        .sei-roman-item {
            font-size: 12pt;
            font-family: Calibri;
            text-align: justify;
            margin: 6pt 6pt 6pt 120px;
        }
        .sei-letter-item {
            font-size: 12pt;
            font-family: Calibri;
            text-align: justify;
            margin: 6pt 6pt 6pt 120px;
        }
        .sei-citation {
            font-size: 10pt;
            font-family: Calibri;
            margin: 5pt 0 5pt 160px;
            text-align: justify;
        }
        .sei-centered {
            font-size: 12pt;
            font-family: Calibri;
            text-align: center;
            margin: 6pt;
        }
        .sei-link {
            color: #0066cc;
            text-decoration: underline;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Header Navigation -->
    <header class="bg-slate-900 text-white px-6 py-3 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center gap-3">
            <div class="bg-brand-500 text-white p-2 rounded-lg font-bold text-lg flex items-center justify-center w-10 h-10">
                <i class="fa-solid fa-file-contract"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Gerador de Ofício SEI</h1>
                <p class="text-xs text-slate-400">Infra S.A. — Abertura de Demanda Automatizada</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="resetForm()" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-md transition flex items-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> Redefinir
            </button>
            <button onclick="copyRichText()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium rounded-lg shadow-sm transition flex items-center gap-2">
                <i class="fa-solid fa-copy"></i> Copiar Formatado para o SEI
            </button>
        </div>
    </header>

    <!-- Main Workspace Area -->
    <div class="flex-1 flex overflow-hidden">

        <!-- LEFT PANEL: Dynamic Form -->
        <div class="w-1/2 bg-white border-r border-slate-200 flex flex-col h-full shadow-inner">
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h2 class="font-semibold text-slate-700 flex items-center gap-2 text-sm uppercase tracking-wider">
                    <i class="fa-solid fa-pen-to-square text-brand-600"></i> Parâmetros do Documento
                </h2>
                <span class="text-xs bg-brand-50 text-brand-700 font-medium px-2.5 py-1 rounded-full border border-brand-100">
                    Preenchimento Rápido
                </span>
            </div>

            <!-- Scrollable Form Container -->
            <div id="formScrollPanel" class="flex-1 overflow-y-auto p-6 space-y-6">

                <!-- Section: Identificação do Documento -->
                <div class="space-y-4">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider border-b pb-1">
